name: Publish Wan Animate INT8 ConvRot experiment

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New image tag"
        required: true
        default: wan-int8-convrot-5090-20260902-r2
      reuse_model_from:
        description: "Existing tag containing the published INT8 checkpoint layer"
        required: false
        default: wan-int8-convrot-5090-20260902-r1
      dedupe_source:
        description: "Existing tag to republish with duplicate layers removed (cleanup-only run)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-wan-animate-worker
  BASE_TAG: wan-q6-vast-direct-20260902-r5
  MODEL_URL: https://huggingface.co/Comfy-Org/Wan-Animate-2/resolve/main/diffusion_models/wan_animate_2_int8_convrot.safetensors
  MODEL_SHA256: 0580ecdd65e47e97c30df9670d13a6c4a131d26de5a1faf2ccc78392d5167584

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reclaim runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune --all --force --volumes
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download official INT8 ConvRot checkpoint when no published layer is available
        if: ${{ inputs.dedupe_source == '' }}
        shell: bash
        env:
          REUSE_MODEL_FROM: ${{ inputs.reuse_model_from }}
        run: |
          set -euo pipefail
          if [ -n "$REUSE_MODEL_FROM" ]; then
            echo "Reusing checkpoint layer from $REUSE_MODEL_FROM; no model download required."
            exit 0
          fi
          curl --fail --location --retry 8 --retry-delay 30 --retry-all-errors \
            --output /tmp/wan_animate_2_int8_convrot.safetensors "${MODEL_URL}"
          echo "${MODEL_SHA256}  /tmp/wan_animate_2_int8_convrot.safetensors" | sha256sum -c -
          stat --printf='checkpoint_bytes=%s\n' /tmp/wan_animate_2_int8_convrot.safetensors

      - name: Prepare Linux comfy-kitchen package
        if: ${{ inputs.dedupe_source == '' }}
        shell: bash
        run: |
          set -euo pipefail
          # The PyTorch 2.8 runtime image uses CPython 3.11. Do not let the
          # hosted runner's interpreter select the cp312-abi3 wheel: that
          # wheel imports on the runner but fails in the worker with an
          # undefined Python C-API symbol.
          python3 -m pip download --no-deps --only-binary=:all: \
            --dest /tmp/comfy-wheel \
            --platform manylinux_2_24_x86_64 \
            --python-version 3.11 \
            --implementation cp \
            --abi cp311 \
            comfy-kitchen==0.2.26
          wheel_name=$(basename "$(find /tmp/comfy-wheel -maxdepth 1 -type f -name '*.whl' -print -quit)")
          case "$wheel_name" in
            comfy_kitchen-0.2.26-cp311-cp311-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl) ;;
            *) echo "Unexpected comfy-kitchen wheel: $wheel_name" >&2; exit 1 ;;
          esac
          python3 - <<'PY'
          import glob
          import pathlib
          import zipfile
          target = pathlib.Path('/tmp/comfy-kitchen-root')
          target.mkdir()
          wheel = glob.glob('/tmp/comfy-wheel/*.whl')
          if len(wheel) != 1:
              raise SystemExit(f'expected one comfy-kitchen wheel, got {wheel}')
          with zipfile.ZipFile(wheel[0]) as archive:
              for name in archive.namelist():
                  if name.startswith('comfy_kitchen/'):
                      archive.extract(name, target)
          PY

      - name: Remove duplicate layers from an existing public tag
        if: ${{ inputs.dedupe_source != '' }}
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ inputs.dedupe_source }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 tools/clean_wan_image_manifest.py \
            --repo "${IMAGE#ghcr.io/}" \
            --source-tag "${SOURCE_TAG}" \
            --target-tag "${TARGET_TAG}"

      - name: Publish separate registry tag
        if: ${{ inputs.dedupe_source == '' }}
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REUSE_MODEL_FROM: ${{ inputs.reuse_model_from }}
        run: |
          set -euo pipefail
          set +e
          publisher_args=(
            --repo "${IMAGE#ghcr.io/}"
            --base-tag "${BASE_TAG}"
            --tag "${TAG}"
            --comfy-kitchen-root /tmp/comfy-kitchen-root
          )
          if [ -n "$REUSE_MODEL_FROM" ]; then
            publisher_args+=(--reuse-model-from "$REUSE_MODEL_FROM")
          else
            publisher_args+=(--checkpoint /tmp/wan_animate_2_int8_convrot.safetensors)
          fi
          python3 tools/publish_wan_int8_convrot_manifest.py "${publisher_args[@]}" 2>&1 | tee /tmp/int8-publish.log
          publish_status=${PIPESTATUS[0]}
          set -e
          if [ "$publish_status" -ne 0 ]; then
            line=$(grep -F 'publisher_error=' /tmp/int8-publish.log | tail -n 1 || true)
            if [ -z "$line" ]; then
              line=$(tail -n 1 /tmp/int8-publish.log)
            fi
            line=${line//'%'/'%25'}
            line=${line//$'\r'/'%0D'}
            line=${line//$'\n'/'%0A'}
            echo "::error::$line"
            exit "$publish_status"
          fi
          df -h /
