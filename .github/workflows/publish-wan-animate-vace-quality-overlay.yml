name: Publish Wan Animate VACE Runtime Fix Overlay

on:
  push:
    branches:
      - wan-animate-int8-convrot-experiment
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-wan-animate-worker
  BASE_TAG: wan-q6-vast-direct-20260905-vace-lightx2v-r12
  TAG: wan-q6-vast-direct-20260905-vace-lightx2v-r13

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Publish registry-only runtime fix overlay
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python tools/publish_wan_overlay_manifest.py \
            --repo-root . \
            --repo "${IMAGE#ghcr.io/}" \
            --base-tag "${BASE_TAG}" \
            --tag "${TAG}" \
            --code-only \
            --worker-entrypoint containers/wan-animate-worker/entrypoint.sh \
            --env-override GENERATIVE_DANCE_CANVAS_WIDTH=480 \
            --env-override GENERATIVE_DANCE_CANVAS_HEIGHT=832 \
            --env-override GENERATIVE_DANCE_FPS=24 \
            --env-override VACE_STITCH_OUTPUT_WIDTH=480 \
            --env-override VACE_STITCH_OUTPUT_HEIGHT=832
