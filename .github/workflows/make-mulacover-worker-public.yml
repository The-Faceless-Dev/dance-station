name: Make MuLaCover Worker Public

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing MuLaCover image tag to make publicly pullable
        required: true
        default: mulacover-20260925-r1
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/make-mulacover-worker-public.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-mulacover-worker
  PACKAGE: faceless-mulacover-worker
  PACKAGE_OWNER: The-Faceless-Dev
  TAG: ${{ inputs.tag || 'mulacover-20260925-r1' }}

jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - name: Set package visibility to public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          status=$(curl --silent --show-error --location \
            --output "${response_file}" --write-out '%{http_code}' \
            --request PATCH \
            --url "https://api.github.com/user/packages/container/${PACKAGE}" \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data '{"visibility":"public"}')
          if [ "${status}" = 404 ]; then
            status=$(curl --silent --show-error --location \
              --output "${response_file}" --write-out '%{http_code}' \
              --request PATCH \
              --url "https://api.github.com/users/${PACKAGE_OWNER}/packages/container/${PACKAGE}" \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/json' \
              --data '{"visibility":"public"}')
          fi
          if [ "${status}" = 404 ]; then
            status=$(curl --silent --show-error --location \
              --output "${response_file}" --write-out '%{http_code}' \
              --request PATCH \
              --url "https://api.github.com/orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE}" \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/json' \
              --data '{"visibility":"public"}')
          fi
          echo "Package visibility response: HTTP ${status}"
          jq '{name,visibility,message,documentation_url}' "${response_file}"
          test "${status}" -ge 200
          test "${status}" -lt 300
          test "$(jq -r '.visibility // empty' "${response_file}")" = public

      - name: Verify anonymous GHCR pullability
        shell: bash
        run: |
          set -euo pipefail
          repository="${IMAGE#ghcr.io/}"
          manifest_url="https://ghcr.io/v2/${repository}/manifests/${TAG}"
          registry_token=$(curl --silent --show-error --fail --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:${repository}:pull" \
            'https://ghcr.io/token' | jq -r '.token')
          test -n "${registry_token}" -a "${registry_token}" != null
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${registry_token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
            "${manifest_url}")
          echo "Anonymous GHCR manifest check: HTTP ${status}"
          test "${status}" = 200
