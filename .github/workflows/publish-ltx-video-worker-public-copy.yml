name: Publish public LTX video worker copy

on:
  workflow_dispatch:
  push:
    branches:
      - wan-animate-int8-convrot-experiment
    paths:
      - .github/workflows/publish-ltx-video-worker-public-copy.yml

permissions:
  contents: read
  packages: write

env:
  SOURCE_IMAGE: ghcr.io/the-faceless-dev/faceless-ltx-video-worker
  TARGET_IMAGE: ghcr.io/the-faceless-dev/faceless-ltx-video-worker-v2
  TAG: ltx-2.5-nvfp4-5090-r1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Seed a repository-linked public package
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'FROM scratch' \
            'LABEL org.opencontainers.image.source="https://github.com/The-Faceless-Dev/dance-station"' \
            > /tmp/Dockerfile
          docker buildx build \
            --file /tmp/Dockerfile \
            --platform linux/amd64 \
            --tag "$TARGET_IMAGE:visibility-seed" \
            --provenance=false \
            --sbom=false \
            --push \
            /tmp

      - name: Verify the linked package is anonymously pullable
        shell: bash
        run: |
          set -euo pipefail
          manifest_url="https://ghcr.io/v2/${TARGET_IMAGE#ghcr.io/}/manifests/visibility-seed"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "$manifest_url")
          echo "Anonymous seed manifest check: HTTP ${status}"
          test "$status" = 200

      - name: Copy the built LTX manifest into the public package
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$TARGET_IMAGE:$TAG" \
            "$SOURCE_IMAGE:$TAG"

      - name: Verify the public LTX manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest_url="https://ghcr.io/v2/${TARGET_IMAGE#ghcr.io/}/manifests/${TAG}"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
            "$manifest_url")
          echo "Anonymous LTX manifest check: HTTP ${status}"
          test "$status" = 200
