name: Publish Wan Animate VACE Final Quality Image

on:
  workflow_dispatch:
  push:
    branches:
      - wan-animate-int8-convrot-experiment

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-wan-animate-worker
  BASE_TAG: wan-q6-vast-direct-20260904-block-offload-vace14b-r1
  TAG: wan-q6-vast-direct-20260904-block-offload-vace14b-quality-r1
  QUALITY_IMAGE: ghcr.io/the-faceless-dev/faceless-wan-vace-stitch-worker:vace13b-20260829-quality-rife9

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reclaim runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune --all --force --volumes
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish final combined quality image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/wan-animate-worker/Dockerfile.vace-vast-final
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:${{ env.BASE_TAG }}
            QUALITY_IMAGE=${{ env.QUALITY_IMAGE }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          provenance: false
          sbom: false
