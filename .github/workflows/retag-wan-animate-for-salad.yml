name: Retag Wan Animate image for Salad

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/retag-wan-animate-for-salad.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-wan-animate-worker
  SOURCE_TAG: wan-q6-salad-20260829-identity-5090-r1
  TARGET_TAG: wan-q6-salad-20260831-identity-5090-pulled-r1

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Copy the exact manifest without rebuilding layers
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${IMAGE}:${TARGET_TAG}" \
            "${IMAGE}:${SOURCE_TAG}"
          docker buildx imagetools inspect "${IMAGE}:${TARGET_TAG}"
