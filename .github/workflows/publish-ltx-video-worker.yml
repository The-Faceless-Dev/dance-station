name: Publish LTX video worker

on:
  push:
    branches:
      - wan-animate-int8-convrot-experiment
    paths:
      - .github/workflows/publish-ltx-video-worker.yml
      - containers/ltx-video-worker/**
      - src/autotransition/ltx_video/**
      - tools/ltx_video/**
      - pyproject.toml
      - README.md
  workflow_dispatch:
    inputs:
      tag:
        description: Public LTX worker tag
        required: true
        default: ltx-2.5-nvfp4-5090-r1

permissions:
  contents: read
  packages: write

concurrency:
  group: ltx-video-worker-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/faceless-ltx-video-worker
  MODEL_REPOSITORY: comfyicu/LTX-2.5

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reclaim runner disk
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune --all --force --volumes || true
          df -h /

      - name: Install model downloader
        shell: bash
        run: python3 -m pip install --no-cache-dir --upgrade "huggingface_hub>=0.34.0"

      - name: Download verified LTX model bundle
        shell: bash
        env:
          HF_HUB_ENABLE_HF_TRANSFER: "1"
          HF_XET_HIGH_PERFORMANCE: "1"
          HF_XET_NUM_CONCURRENT_RANGE_GETS: "64"
        run: |
          set -euo pipefail
          mkdir -p ltx-models
          hf download "$MODEL_REPOSITORY" \
            diffusion_models/ltx-2.5-22b-distilled-transformer-nvfp4.safetensors \
            text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors \
            vae/ltx-2.5-video-vae-conv-bf16.safetensors \
            vae/ltx-2.5-audio-vae-bf16.safetensors \
            latent_upscale_models/ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors \
            --local-dir ltx-models

      - name: Verify model bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ltx_video/verify_model_bundle.py ltx-models

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR with repository token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and publish model-bearing image
        shell: bash
        env:
          TAG: ${{ inputs.tag || 'ltx-2.5-nvfp4-5090-r1' }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file containers/ltx-video-worker/Dockerfile \
            --build-context ltxmodels=ltx-models \
            --platform linux/amd64 \
            --tag "$IMAGE:$TAG" \
            --provenance=false \
            --sbom=false \
            --push \
            .

      - name: Make package public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || 'ltx-2.5-nvfp4-5090-r1' }}
        run: |
          set -euo pipefail
          package='faceless-ltx-video-worker'
          response=$(curl --silent --show-error --fail-with-body \
            --request PATCH \
            --url "https://api.github.com/user/packages/container/${package}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"visibility":"public"}') || {
              echo "Package visibility update failed; the image was pushed but may need manual public visibility." >&2
              exit 1
            }
          echo "$response" | jq '{name,visibility,updated_at}'

      - name: Verify anonymous pullability
        shell: bash
        env:
          TAG: ${{ inputs.tag || 'ltx-2.5-nvfp4-5090-r1' }}
        run: |
          set -euo pipefail
          manifest_url="https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/${TAG}"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
            "$manifest_url")
          test "$status" = 200
          echo "Anonymous GHCR manifest check passed: HTTP $status"
