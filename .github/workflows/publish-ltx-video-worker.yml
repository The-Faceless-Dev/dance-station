name: Publish LTX video worker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Public LTX worker tag
        required: true
        default: ltx-2.5-nvfp4-5090-r1

permissions:
  contents: read
  packages: write

concurrency:
  group: ltx-video-worker-publish
  cancel-in-progress: false

env:
  # Docker image references must be lowercase even when the GitHub owner is
  # displayed with capital letters.
  IMAGE: ghcr.io/the-faceless-dev/faceless-ltx-video-worker
  MODEL_REPOSITORY: comfyicu/LTX-2.5
  TEXT_ENCODER_REPOSITORY: FusionCow/Gemma-3-12b-Abliterated-LTX2
  TEXT_ENCODER_FILE: gemma_ablit_fixed_bf16.safetensors

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reclaim runner disk
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune --all --force --volumes || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR with repository token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and publish runtime base
        shell: bash
        env:
          BASE_TAG: ltx-2.5-runtime-base-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file containers/ltx-video-worker/Dockerfile \
            --target runtime-base \
            --platform linux/amd64 \
            --tag "$IMAGE:$BASE_TAG" \
            --provenance=false \
            --sbom=false \
            --push \
            .

      - name: Build and publish model-bearing image
        shell: bash
        env:
          TAG: ${{ inputs.tag || 'ltx-2.5-nvfp4-5090-r1' }}
          BASE_TAG: ltx-2.5-runtime-base-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file containers/ltx-video-worker/Dockerfile.registry \
            --build-arg BASE_IMAGE="$IMAGE:$BASE_TAG" \
            --build-arg MODEL_REPOSITORY="$MODEL_REPOSITORY" \
            --build-arg TEXT_ENCODER_REPOSITORY="$TEXT_ENCODER_REPOSITORY" \
            --build-arg TEXT_ENCODER_FILE="$TEXT_ENCODER_FILE" \
            --platform linux/amd64 \
            --tag "$IMAGE:$TAG" \
            --provenance=false \
            --sbom=false \
            --push \
            .

      - name: Verify anonymous pullability
        shell: bash
        env:
          TAG: ${{ inputs.tag || 'ltx-2.5-nvfp4-5090-r1' }}
        run: |
          set -euo pipefail
          manifest_url="https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/${TAG}"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
            "$manifest_url")
          test "$status" = 200
          echo "Anonymous GHCR manifest check passed: HTTP $status"
