name: Make YuE2 Worker Public

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing YuE2 image tag to make publicly pullable
        required: true
        default: yue2-3b-q8-f16-20260914-r1

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-yue2-worker
  PACKAGE: faceless-yue2-worker
  PACKAGE_OWNER: The-Faceless-Dev
  TAG: ${{ inputs.tag || 'yue2-3b-q8-f16-20260914-r1' }}

jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR with repository credential
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Link package to this repository
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          SEED_TAG: yue2-visibility-seed-${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            'FROM scratch' \
            'LABEL org.opencontainers.image.source="https://github.com/The-Faceless-Dev/dance-station"' \
            > /tmp/Dockerfile
          printf '%s\n' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          docker buildx build \
            --file /tmp/Dockerfile \
            --platform linux/amd64 \
            --tag "${IMAGE}:${SEED_TAG}" \
            --provenance=false \
            --sbom=false \
            --push \
            /tmp

      - name: Set package visibility to public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          status=$(curl --silent --show-error --location \
            --output "${response_file}" --write-out '%{http_code}' \
            --request PATCH \
            --url "https://api.github.com/user/packages/container/${PACKAGE}" \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data '{"visibility":"public"}')
          if [ "${status}" = 404 ]; then
            status=$(curl --silent --show-error --location \
              --output "${response_file}" --write-out '%{http_code}' \
              --request PATCH \
              --url "https://api.github.com/users/${PACKAGE_OWNER}/packages/container/${PACKAGE}" \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/json' \
              --data '{"visibility":"public"}')
          fi
          cat "${response_file}" | jq '{name,visibility,message,documentation_url}'
          test "${status}" -ge 200
          test "${status}" -lt 300
          test "$(jq -r '.visibility // empty' "${response_file}")" = public

      - name: Verify anonymous GHCR pullability
        shell: bash
        run: |
          set -euo pipefail
          repository="${IMAGE#ghcr.io/}"
          manifest_url="https://ghcr.io/v2/${repository}/manifests/${TAG}"
          registry_token=$(curl --silent --show-error --fail --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:${repository}:pull" \
            'https://ghcr.io/token' | jq -r '.token')
          test -n "${registry_token}" -a "${registry_token}" != null
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${registry_token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
            "${manifest_url}")
          echo "Anonymous GHCR manifest check: HTTP ${status}"
          test "${status}" = 200
