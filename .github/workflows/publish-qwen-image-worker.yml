name: Publish Qwen Image Worker

on:
  push:
    branches:
      - wan-animate-int8-convrot-experiment
    paths:
      - ".github/workflows/publish-qwen-image-worker.yml"
      - "containers/qwen-image-worker/**"
      - "src/autotransition/qwen_image/**"
      - "src/autotransition/cli.py"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      tag:
        description: Published Qwen Image worker tag
        required: true
        default: qwen-image-2512-q8-20260912-r1

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-qwen-image-worker
  TAG: ${{ inputs.tag || 'qwen-image-2512-q8-20260912-r1' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check runner storage
        shell: bash
        run: df -h /

      - name: Reclaim runner storage for model-bearing build
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache
          sudo docker system prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and publish model-bearing image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/qwen-image-worker/Dockerfile
          target: runtime
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Verify published image manifest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          docker buildx imagetools inspect "${IMAGE}:${TAG}" --raw \
            | jq -e '.config.digest and (.layers | length > 0)' >/dev/null

      - name: Make container package public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --request PATCH \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"visibility":"public"}' \
            "https://api.github.com/user/packages/container/faceless-qwen-image-worker"
