name: Publish Qwen Image Worker

on:
  push:
    branches:
      - wan-animate-int8-convrot-experiment
    paths:
      - ".github/workflows/publish-qwen-image-worker.yml"
      - "containers/qwen-image-worker/**"
      - "containers/qwen-image-worker/Dockerfile.fp8-encoder-test"
      - "src/autotransition/qwen_image/**"
      - "src/autotransition/cli.py"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      tag:
        description: Published Qwen Image worker tag
        required: true
        default: qwen-image-2512-q8-20260913-diagnostic-r1

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-qwen-image-worker
  TAG: ${{ github.event_name == 'push' && 'qwen-image-2512-q8-fp8-encoder-test-20260913-r1' || inputs.tag || 'qwen-image-2512-q8-20260913-diagnostic-r1' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check runner storage
        shell: bash
        run: df -h /

      - name: Reclaim runner storage for model-bearing build
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache
          sudo docker system prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and publish model-bearing image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ contains(github.event.head_commit.message, 'Qwen FP8') && 'containers/qwen-image-worker/Dockerfile.fp8-encoder-test' || 'containers/qwen-image-worker/Dockerfile' }}
          target: runtime
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Verify published image manifest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          docker buildx imagetools inspect "${IMAGE}:${TAG}" --raw \
            | jq -e '.config.digest and (.layers | length > 0)' >/dev/null

      - name: Verify package is publicly pullable
        shell: bash
        run: |
          set -euo pipefail
          repository="${IMAGE#ghcr.io/}"
          manifest_url="https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/${TAG}"
          registry_token=$(curl --silent --show-error --fail --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:${repository}:pull" \
            'https://ghcr.io/token' | jq -r '.token')
          test -n "${registry_token}" -a "${registry_token}" != null
          for attempt in 1 2 3 4 5; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer ${registry_token}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
              "${manifest_url}")
            echo "Anonymous GHCR manifest check ${attempt}/5: HTTP ${status}"
            if [ "${status}" = 200 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "The published tag is not publicly pullable; refusing to mark the image ready." >&2
          exit 1
