name: Publish Wan Animate Overlay

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-wan-animate-overlay.yml
      - containers/wan-animate-worker/Dockerfile.identity-5090
      - src/autotransition/generative_dance/**
      - tools/generative_dance/wan_animate_2_runner.py

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-wan-animate-worker
  BASE_IMAGE: ghcr.io/the-faceless-dev/faceless-wan-animate-worker:wan-q6-salad-20260826-r7
  TAG: wan-q6-salad-20260831-identity-5090-compat-r1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prepare single-layer overlay context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wan-overlay-context
          mkdir -p .wan-overlay-context/payload/app/src/autotransition
          mkdir -p .wan-overlay-context/payload/app/tools/generative_dance
          cp -a src/autotransition/generative_dance \
            .wan-overlay-context/payload/app/src/autotransition/
          cp tools/generative_dance/wan_animate_2_runner.py \
            .wan-overlay-context/payload/app/tools/generative_dance/
          cp containers/wan-animate-worker/Dockerfile.identity-5090 \
            .wan-overlay-context/Dockerfile

      - name: Build and publish overlay
        shell: bash
        run: |
          set -euo pipefail

          # Pull the base with retries before invoking the legacy Docker builder.
          # This keeps BuildKit from re-reading the large model layer after a
          # transient GHCR 429 and leaves the final image at 34 layers.
          for attempt in 1 2 3 4; do
            if docker pull "${BASE_IMAGE}"; then
              break
            fi
            if [ "${attempt}" -eq 4 ]; then
              echo "Unable to pull ${BASE_IMAGE} after ${attempt} attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 90))"
          done

          docker build \
            --file ./.wan-overlay-context/Dockerfile \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --tag "${IMAGE}:${TAG}" \
            ./.wan-overlay-context
          docker push "${IMAGE}:${TAG}"
