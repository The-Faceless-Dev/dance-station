name: Publish Wan Animate Code Overlay

on:
  push:
    branches:
      - wan-animate-int8-convrot-experiment
  workflow_dispatch:
    inputs:
      base_tag:
        description: Existing public Wan image tag to inherit
        required: true
        default: wan-q6-vast-direct-20260905-vace-lightx2v-r4
      tag:
        description: New code-overlay tag
        required: true
        default: wan-q6-vast-direct-20260905-vace-lightx2v-r5

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-wan-animate-worker
  BASE_TAG: ${{ inputs.base_tag || 'wan-q6-vast-direct-20260905-vace-lightx2v-r4' }}
  TAG: ${{ inputs.tag || 'wan-q6-vast-direct-20260905-vace-lightx2v-r5' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compose and publish registry overlay
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m pip download --no-deps --only-binary=:all: \
            --platform manylinux2014_x86_64 --python-version 311 \
            --implementation cp scipy==1.14.1 --dest /tmp/scipy-wheel
          scipy_wheel=$(find /tmp/scipy-wheel -maxdepth 1 -type f -name 'scipy-*.whl' -print -quit)
          test -n "${scipy_wheel}"
          python3 -m pip download --no-deps --only-binary=:all: \
            --platform manylinux2014_x86_64 --python-version 311 \
            --implementation cp imageio-ffmpeg==0.6.0 --dest /tmp/imageio-ffmpeg-wheel
          imageio_ffmpeg_wheel=$(find /tmp/imageio-ffmpeg-wheel -maxdepth 1 -type f -name 'imageio_ffmpeg-*.whl' -print -quit)
          test -n "${imageio_ffmpeg_wheel}"
          python3 -m pip download --no-deps --only-binary=:all: \
            --platform manylinux2014_x86_64 --python-version 311 \
            --implementation cp prometheus-client==0.22.1 --dest /tmp/prometheus-client-wheel
          prometheus_client_wheel=$(find /tmp/prometheus-client-wheel -maxdepth 1 -type f -name 'prometheus_client-*.whl' -print -quit)
          test -n "${prometheus_client_wheel}"
          python3 -m pip download --no-deps --only-binary=:all: \
            --platform manylinux2014_x86_64 --python-version 311 \
            --implementation cp pyzmq==26.2.1 --dest /tmp/pyzmq-wheel
          pyzmq_wheel=$(find /tmp/pyzmq-wheel -maxdepth 1 -type f -name 'pyzmq-*.whl' -print -quit)
          test -n "${pyzmq_wheel}"
          python3 tools/publish_wan_overlay_manifest.py \
            --repo "${IMAGE#ghcr.io/}" \
            --base-tag "${BASE_TAG}" \
            --tag "${TAG}" \
            --code-only \
            --scipy-wheel "${scipy_wheel}" \
            --imageio-ffmpeg-wheel "${imageio_ffmpeg_wheel}" \
            --prometheus-client-wheel "${prometheus_client_wheel}" \
            --pyzmq-wheel "${pyzmq_wheel}" \
            --worker-entrypoint containers/vace-stitch-worker/entrypoint.sh
