name: Publish Wan Animate Overlay

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-wan-animate-overlay.yml
      - containers/wan-animate-worker/Dockerfile.identity-5090
      - src/autotransition/generative_dance/**
      - tools/generative_dance/wan_animate_2_runner.py

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-wan-animate-worker
  BASE_IMAGE: ghcr.io/the-faceless-dev/faceless-wan-animate-worker:wan-q6-salad-20260829-identity-5090-r1
  TAG: wan-q6-salad-20260829-identity-5090-r1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compose and publish registry overlay
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/publish_wan_overlay_manifest.py \
            --repo "${IMAGE#ghcr.io/}" \
            --base-tag "wan-q6-salad-20260829-identity-5090-r1" \
            --tag "${TAG}"
