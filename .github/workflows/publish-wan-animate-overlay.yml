name: Publish Wan Animate Code Overlay

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: Existing public Wan image tag to inherit
        required: true
        default: wan-q6-vast-direct-20260904-block-offload-vace14b-quality-r5
      tag:
        description: New code-overlay tag
        required: true
        default: wan-q6-vast-direct-20260904-block-offload-vace14b-quality-r6

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-wan-animate-worker
  BASE_TAG: ${{ inputs.base_tag || 'wan-q6-vast-direct-20260904-block-offload-vace14b-quality-r5' }}
  TAG: ${{ inputs.tag || 'wan-q6-vast-direct-20260904-block-offload-vace14b-quality-r6' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compose and publish registry overlay
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/publish_wan_overlay_manifest.py \
            --repo "${IMAGE#ghcr.io/}" \
            --base-tag "${BASE_TAG}" \
            --tag "${TAG}" \
            --code-only
