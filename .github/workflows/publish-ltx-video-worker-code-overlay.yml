name: Publish LTX video worker code overlay

on:
  push:
    branches:
      - wan-animate-int8-convrot-experiment
    paths:
      - .github/workflows/publish-ltx-video-worker-code-overlay.yml
      - containers/ltx-video-worker/Dockerfile.overlay
      - src/autotransition/ltx_video/**
  workflow_dispatch:
    inputs:
      base_tag:
        description: Public model-bearing LTX tag to inherit
        required: true
        default: ltx-2.5-nvfp4-5090-r1
      tag:
        description: Public code-overlay tag
        required: true
        default: ltx-2.5-nvfp4-5090-r2

permissions:
  contents: read
  packages: write

concurrency:
  group: ltx-video-worker-code-overlay
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-wan-animate-worker
  BASE_TAG: ${{ inputs.base_tag || 'ltx-2.5-nvfp4-5090-r1' }}
  TAG: ${{ inputs.tag || 'ltx-2.5-nvfp4-5090-r2' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Build and publish code overlay
        shell: bash
        env:
          BASE_IMAGE: ${{ env.IMAGE }}:${{ env.BASE_TAG }}
          TARGET_IMAGE: ${{ env.IMAGE }}:${{ env.TAG }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file containers/ltx-video-worker/Dockerfile.overlay \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --platform linux/amd64 \
            --tag "$TARGET_IMAGE" \
            --provenance=false \
            --sbom=false \
            --push \
            .

      - name: Verify anonymous pullability
        shell: bash
        env:
          TARGET_IMAGE: ${{ env.IMAGE }}:${{ env.TAG }}
        run: |
          set -euo pipefail
          manifest_url="https://ghcr.io/v2/${TARGET_IMAGE#ghcr.io/}/manifests/${TAG}"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
            "$manifest_url")
          echo "Anonymous LTX overlay manifest check: HTTP $status"
          test "$status" = 200
