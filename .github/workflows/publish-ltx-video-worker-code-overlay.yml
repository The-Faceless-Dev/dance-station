name: Publish LTX video worker code overlay

on:
  push:
    branches:
      - wan-animate-int8-convrot-experiment
    paths:
      - .github/workflows/publish-ltx-video-worker-code-overlay.yml
      - containers/ltx-video-worker/Dockerfile.overlay
      - src/autotransition/ltx_video/**
  workflow_dispatch:
    inputs:
      base_tag:
        description: Public model-bearing LTX tag to inherit
        required: true
        default: ltx-2.5-nvfp4-5090-r1
      tag:
        description: Public code-overlay tag
        required: true
        default: ltx-2.5-nvfp4-5090-r5

permissions:
  contents: read
  packages: write

concurrency:
  group: ltx-video-worker-code-overlay
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-wan-animate-worker
  BASE_TAG: ${{ inputs.base_tag || 'ltx-2.5-nvfp4-5090-r1' }}
  TAG: ${{ inputs.tag || 'ltx-2.5-nvfp4-5090-r5' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compose and publish registry overlay
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 tools/publish_wan_overlay_manifest.py \
            --repo "${IMAGE#ghcr.io/}" \
            --runtime ltx \
            --base-tag "${BASE_TAG}" \
            --tag "${TAG}" \
            --code-only

      - name: Verify anonymous pullability
        shell: bash
        env:
          TARGET_IMAGE: ${{ env.IMAGE }}:${{ env.TAG }}
        run: |
          set -euo pipefail
          repository="${TARGET_IMAGE#ghcr.io/}"
          repository="${repository%:${TAG}}"
          pull_token=$(curl --fail --silent --show-error \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull" \
            | jq --raw-output '.token')
          test -n "${pull_token}"
          manifest_url="https://ghcr.io/v2/${repository}/manifests/${TAG}"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${pull_token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
            "$manifest_url")
          echo "Anonymous LTX overlay manifest check: HTTP $status"
          test "$status" = 200
