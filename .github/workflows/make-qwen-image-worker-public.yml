name: Verify Qwen Image Worker is public

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Qwen image tag to make publicly pullable
        required: true
        default: qwen-image-2512-q8-20260913-diagnostic-r1
  push:
    branches:
      - wan-animate-int8-convrot-experiment
    paths:
      - .github/workflows/make-qwen-image-worker-public.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-qwen-image-worker
  PACKAGE: faceless-qwen-image-worker
  PACKAGE_OWNER: The-Faceless-Dev
  TAG: ${{ inputs.tag || 'qwen-image-2512-q8-20260913-diagnostic-r1' }}

jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Link package to this workflow repository
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}
          SEED_TAG: qwen-image-visibility-seed-${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            'FROM scratch' \
            'LABEL org.opencontainers.image.source="https://github.com/The-Faceless-Dev/dance-station"' \
            > /tmp/Dockerfile
          printf '%s\n' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          docker buildx build \
            --file /tmp/Dockerfile \
            --platform linux/amd64 \
            --tag "${IMAGE}:${SEED_TAG}" \
            --provenance=false \
            --sbom=false \
            --push \
            /tmp

      - name: Make GHCR package public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          identity_file=$(mktemp)
          identity_status=$(curl --silent --show-error --location \
            --output "${identity_file}" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/user')
          echo "GitHub credential identity response: HTTP ${identity_status}"
          jq '{login,id,type}' "${identity_file}"
          if [ "${identity_status}" != 200 ]; then
            echo "The repository CI credential could not authenticate to GitHub." >&2
            exit 1
          fi

          response_file=$(mktemp)
          patch_visibility() {
            local endpoint="$1"
            curl --silent --show-error --location \
              --output "${response_file}" --write-out '%{http_code}' \
              --request PATCH \
              --url "${endpoint}" \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/json' \
              --data '{"visibility":"public"}'
          }

          status=$(patch_visibility "https://api.github.com/user/packages/container/${PACKAGE}")
          echo "Authenticated-user visibility response: HTTP ${status}"
          jq '{name,visibility,message,documentation_url}' "${response_file}" || true
          if [ "${status}" = 404 ]; then
            status=$(patch_visibility "https://api.github.com/users/${PACKAGE_OWNER}/packages/container/${PACKAGE}")
            echo "Explicit-owner visibility response: HTTP ${status}"
            jq '{name,visibility,message,documentation_url}' "${response_file}" || true
          fi
          if [ "${status}" = 404 ]; then
            status=$(patch_visibility "https://api.github.com/orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE}")
            echo "Explicit-organization visibility response: HTTP ${status}"
            jq '{name,visibility,message,documentation_url}' "${response_file}" || true
          fi
          test "${status}" -ge 200
          test "${status}" -lt 300
          test "$(jq -r '.visibility // empty' "${response_file}")" = public

      - name: Verify anonymous GHCR pullability
        shell: bash
        run: |
          set -euo pipefail
          manifest_url="https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/${TAG}"
          for attempt in 1 2 3 4 5; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
              "${manifest_url}")
            echo "Anonymous GHCR manifest check ${attempt}/5: HTTP ${status}"
            if [ "${status}" = 200 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "The package is not publicly pullable." >&2
          exit 1
