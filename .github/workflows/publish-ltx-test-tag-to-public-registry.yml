name: Publish LTX test tag to public registry

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Private source tag containing the completed LTX image
        required: true
        default: ltx-2.5-nvfp4-5090-r1
      tag:
        description: Public target tag
        required: true
        default: ltx-2.5-nvfp4-5090-r2
  push:
    branches:
      - wan-animate-int8-convrot-experiment
    paths:
      - .github/workflows/publish-ltx-test-tag-to-public-registry.yml

permissions:
  contents: read
  packages: write

env:
  SOURCE_IMAGE: ghcr.io/the-faceless-dev/faceless-ltx-video-worker
  TARGET_IMAGE: ghcr.io/the-faceless-dev/faceless-wan-animate-worker
  SOURCE_TAG: ${{ inputs.source_tag || 'ltx-2.5-nvfp4-5090-r1' }}
  TAG: ${{ inputs.tag || 'ltx-2.5-nvfp4-5090-r2' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Copy the built LTX manifest to the public worker registry
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$TARGET_IMAGE:$TAG" \
            "$SOURCE_IMAGE:$SOURCE_TAG"

      - name: Verify anonymous pullability
        shell: bash
        run: |
          set -euo pipefail
          manifest_url="https://ghcr.io/v2/${TARGET_IMAGE#ghcr.io/}/manifests/${TAG}"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
            "$manifest_url")
          echo "Anonymous manifest check: HTTP ${status}"
          test "$status" = 200
