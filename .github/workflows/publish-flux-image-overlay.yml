name: Publish Flux Image Code Overlay

on:
  push:
    branches:
      - wan-animate-int8-convrot-experiment
  workflow_dispatch:
    inputs:
      base_tag:
        description: Existing public Flux image tag to inherit
        required: true
        default: flux2-klein-4b-20260907-portrait-960x1664-r9
      tag:
        description: New code-overlay tag
        required: true
        default: flux2-klein-4b-20260907-portrait-960x1664-r10

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-flux-image-worker
  BASE_TAG: ${{ inputs.base_tag || 'flux2-klein-4b-20260907-portrait-960x1664-r9' }}
  TAG: ${{ inputs.tag || 'flux2-klein-4b-20260907-portrait-960x1664-r10' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish registry-only runtime overlay
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python tools/publish_wan_overlay_manifest.py \
            --runtime flux \
            --repo-root . \
            --repo "${IMAGE#ghcr.io/}" \
            --base-tag "${BASE_TAG}" \
            --tag "${TAG}" \
            --code-only \
            --env-override FLUX_IMAGE_AVATAR_WIDTH=960 \
            --env-override FLUX_IMAGE_AVATAR_HEIGHT=1664 \
            --env-override FLUX_IMAGE_AVATAR_SUBJECT_SCALE=0.70

      - name: Verify anonymous Flux manifest pullability
        shell: bash
        run: |
          set -euo pipefail
          repository="${IMAGE#ghcr.io/}"
          manifest_url="https://ghcr.io/v2/${repository}/manifests/${TAG}"
          registry_token=$(curl --silent --show-error --fail --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:${repository}:pull" \
            'https://ghcr.io/token' | jq -r '.token')
          test -n "${registry_token}" -a "${registry_token}" != null
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${registry_token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
            "${manifest_url}")
          test "${status}" = 200
          echo "Anonymous GHCR manifest check passed: HTTP ${status}"
