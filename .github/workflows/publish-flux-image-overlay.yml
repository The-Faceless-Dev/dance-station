name: Publish Flux Image Code Overlay

on:
  push:
    branches:
      - wan-animate-int8-convrot-experiment
  workflow_dispatch:
    inputs:
      base_tag:
        description: Existing public Flux image tag to inherit
        required: true
        default: flux2-klein-4b-20260817-r7
      tag:
        description: New code-overlay tag
        required: true
        default: flux2-klein-4b-20260907-portrait-960x1664-r9

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-faceless-dev/faceless-flux-image-worker
  BASE_TAG: ${{ inputs.base_tag || 'flux2-klein-4b-20260817-r7' }}
  TAG: ${{ inputs.tag || 'flux2-klein-4b-20260907-portrait-960x1664-r9' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish registry-only runtime overlay
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python tools/publish_wan_overlay_manifest.py \
            --runtime flux \
            --repo-root . \
            --repo "${IMAGE#ghcr.io/}" \
            --base-tag "${BASE_TAG}" \
            --tag "${TAG}" \
            --code-only \
            --env-override FLUX_IMAGE_AVATAR_WIDTH=960 \
            --env-override FLUX_IMAGE_AVATAR_HEIGHT=1664 \
            --env-override FLUX_IMAGE_AVATAR_SUBJECT_SCALE=0.70

      - name: Ensure Flux container package is public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --request PATCH \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"visibility":"public"}' \
            "https://api.github.com/user/packages/container/faceless-flux-image-worker"
