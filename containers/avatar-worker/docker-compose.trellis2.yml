services:
  avatar-worker:
    build:
      context: ../..
      dockerfile: containers/avatar-worker/Dockerfile.trellis2
    gpus: all
    ports:
      - "${AVATAR_WORKER_PORT:-8091}:8090"
    environment:
      AVATAR_GPU_REQUIRED: "1"
      AVATAR_IMAGE_COMMAND: >-
        python /app/tools/avatar/flux2_klein_generate.py
        --prompt-file {prompt_file}
        --negative-prompt-file {negative_prompt_file}
        --output {output}
        --seed {seed}
        --reference-image {reference_image}
      AVATAR_MESH_COMMAND: >-
        python /app/tools/avatar/trellis2_generate.py
        --image {image}
        --output-dir {output_dir}
        --output {output}
        --quality {quality}
      AVATAR_RIG_COMMAND: >-
        python /app/tools/avatar/rig_runner.py
        --skintokens-repo /models/SkinTokens
        --input {input}
        --output {output}
        --manifest-output {manifest_output}
        --profile auto
        --use-transfer
      AVATAR_RESKIN_COMMAND: >-
        python /app/tools/avatar/reskin_runner.py
        --skintokens-repo /models/SkinTokens
        --input {input}
        --output {output}
        --profile {profile}
        --manifest-output {manifest_output}
        --profile-mode auto
        --use-transfer
      AVATAR_MESH_MODEL_REVISION: ${AVATAR_MESH_MODEL_REVISION:-trellis.2-4b}
      KLEIN_4B_MODEL_PATH: /models/flux2/flux-2-klein-4b.safetensors
      AE_MODEL_PATH: /models/flux2/ae.safetensors
      FLUX2_TEXT_ENCODER_PATH: /models/flux2/Qwen3-4B
      TRELLIS2_MODEL_PATH: /models/trellis2
      TRELLIS2_ALLOW_MODEL_DOWNLOAD: "0"
    volumes:
      - avatar-jobs:/var/lib/faceless/avatar-jobs

volumes:
  avatar-jobs:
